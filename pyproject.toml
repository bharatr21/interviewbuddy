[project]
name = "interviewbuddy"
version = "0.1.0"
description = "Crawler-backed RAG interview preparation buddy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apify-client>=2.0.0",
    "fastapi>=0.115.0",
    "langgraph>=1.0.0",
    "openai>=1.82.0",
    "pgvector>=0.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.40.0",
    "tavily-python>=0.7.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
interviewbuddy = "interviewbuddy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/interviewbuddy"]
